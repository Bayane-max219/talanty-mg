spring.application.name=talanty-backend

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talanty_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:talanty_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:talanty_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:talantyMGsecretKey2024SuperSecure@Madagascar!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=8080
server.servlet.context-path=/

# CORS - only middleware API is allowed
app.cors.allowed-origins=http://localhost:3001,http://talanty-middleware:3001

# Upload size limit (pour les images base64)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.mvc.async.request-timeout=60000

# Jackson — dates as ISO string (not array)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Indian/Antananarivo

# Logging
logging.level.mg.talanty=INFO
logging.level.org.springframework.security=WARN
